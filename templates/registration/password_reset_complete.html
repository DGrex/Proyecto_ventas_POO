{% extends 'billing/base.html' %}
{% block title %}Cuenta activada{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <div class="row g-0 auth-card">
          <div class="col-md-5 auth-side-panel d-none d-md-flex">
            <div>
              <div class="auth-hero-icon mb-3"><i class="bi bi-check-circle-fill"></i></div>
              <h5>Todo listo</h5>
              <p class="mb-4">Tu contraseña se guardó correctamente.</p>
            </div>
          </div>
          <div class="col-md-7 bg-white">
            <div class="card-body text-center">
              <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                <h4 class="mb-1 mt-3">¡Contraseña creada con éxito!</h4>
                <p class="text-muted auth-footer-text">Ya puedes iniciar sesión con tu usuario y tu nueva contraseña.</p>
              </div>
              <a href="{% url 'security:login' %}" class="btn btn-primary w-100 btn-lg">Iniciar sesión</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
