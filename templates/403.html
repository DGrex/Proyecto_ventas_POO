{% extends 'billing/base.html' %}
{% block title %}Acceso Denegado{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm text-center" style="border-radius: 14px;">
        <div class="card-body p-5">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
               style="width:80px;height:80px;border-radius:50%;background:#fee2e2;">
            <i class="bi bi-shield-lock-fill" style="font-size:2.2rem;color:#b91c1c;"></i>
          </div>
          <h4 class="fw-bold mb-2">Acceso Denegado</h4>
          <p class="text-muted mb-4">
            No tienes permiso para realizar esta acción. Si crees que esto es un error,
            contacta a un administrador para que revise los permisos de tu rol.
          </p>
          <a href="{% url 'billing:home' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
            <i class="bi bi-house-door me-1"></i>Volver al Inicio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
